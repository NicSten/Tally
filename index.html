<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E8E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A15" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Tally</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one phone-width column, sticky header per view, fixed bottom tab bar — same frame as Jot */
:root{
  --bg:#E6E8E5; --surface:#F6F7F5; --raised:#FFFFFF; --line:#D3D7D0; --ink:#20261F; --muted:#697165;
  --green:#2E7A46; --green-ink:#1E5A31; --green-soft:#D6E9DA;
  --debt:#A3392E; --debt-soft:#F1DCD8; --save:#2D6A8A; --save-soft:#D5E5EE; --bill:#8A6A2D; --bill-soft:#EFE5CF;
  --track:#DDE1DB; --shadow:rgba(20,30,20,.25); --on-accent:#FFFFFF;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151A15; --surface:#1D231D; --raised:#252C25; --line:#323B31; --ink:#E4E9E2; --muted:#98A294;
  --green:#4FA56B; --green-ink:#8FD3A3; --green-soft:#21382A;
  --debt:#E0786B; --debt-soft:#3C2421; --save:#6FB0D3; --save-soft:#1E3240; --bill:#D2AE63; --bill-soft:#3A3120;
  --track:#2B332A; --shadow:rgba(0,0,0,.5); --on-accent:#0F1A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151A15; --surface:#1D231D; --raised:#252C25; --line:#323B31; --ink:#E4E9E2; --muted:#98A294;
  --green:#4FA56B; --green-ink:#8FD3A3; --green-soft:#21382A;
  --debt:#E0786B; --debt-soft:#3C2421; --save:#6FB0D3; --save-soft:#1E3240; --bill:#D2AE63; --bill-soft:#3A3120;
  --track:#2B332A; --shadow:rgba(0,0,0,.5); --on-accent:#0F1A12; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:6px}
h1{flex:1;min-width:0;margin:0;font-size:1.65rem;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-head{color:var(--muted);font-size:.9rem;margin-top:2px}
.icon-btn{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:1.35rem;line-height:1}
.icon-btn:active{background:var(--line)}
main{padding-block:6px 120px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}

.example{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;background:var(--bill-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.9rem}
.example b{color:var(--bill)}
.example div{display:flex;gap:6px}
.example button{border:0;border-radius:9px;padding:7px 11px;font-weight:600;background:var(--raised);color:var(--ink)}
.example button.primary{background:var(--green);color:var(--on-accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0;font-size:1rem}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head small{color:var(--muted);font-size:.84rem}
.add-btn{border:0;background:var(--green-soft);color:var(--green-ink);font-weight:600;border-radius:9px;padding:6px 11px;font-size:.88rem}

.hero{padding:16px}
.hero .lbl{color:var(--muted);font-size:.86rem}
.hero .big{font-size:2.3rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.hero .big.neg{color:var(--debt)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:.88rem;line-height:1.4}
.flow{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--track);margin-top:14px}
.flow i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-top:10px;font-size:.84rem}
.legend span{display:flex;align-items:center;gap:7px;min-width:0}
.legend span::before{content:"";flex:none;width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{margin-left:auto;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.tile span{display:block;font-size:.8rem;color:var(--muted)}
.tile b{display:block;font-size:1.3rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:.78rem;color:var(--muted);margin-top:1px}

.rows{list-style:none;margin:0;padding:0}
.rows li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 2px}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;overflow-wrap:anywhere}
.row-main small{display:block;color:var(--muted);font-size:.8rem;margin-top:1px}
.row-amt{flex:none;text-align:right;font-weight:600}
.row-amt small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.pill{flex:none;font-size:.72rem;font-weight:650;border-radius:999px;padding:3px 8px;letter-spacing:.02em}
.p-pay{background:var(--green-soft);color:var(--green-ink)}
.p-bill{background:var(--bill-soft);color:var(--bill)}
.p-debt{background:var(--debt-soft);color:var(--debt)}
.p-save{background:var(--save-soft);color:var(--save)}
.date-col{flex:none;width:44px;text-align:center;line-height:1.1}
.date-col b{display:block;font-size:1.1rem}
.date-col small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.empty{color:var(--muted);text-align:center;padding:18px 10px;margin:0;line-height:1.5;font-size:.92rem}
.rows li.split{display:flex;align-items:center;gap:4px}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:.85rem;font-weight:700;padding:0;line-height:1}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.check-sp{flex:none;width:30px}
li.paid .row-main b{text-decoration:line-through;color:var(--muted)}
li.paid .row-amt{color:var(--muted)!important}
.goal{display:block;font-size:.8rem;margin-top:3px;font-weight:600}
.goal.ok{color:var(--green-ink)}.goal.behind{color:var(--bill)}
.mini-prog.wide{max-width:none}
.mini-prog.over i{background:var(--debt)}
.mnav{display:flex;align-items:center;gap:2px}
.mnav button{border:0;background:none;color:var(--muted);font-size:1.2rem;width:34px;height:34px;border-radius:9px}
.mnav button:disabled{opacity:.3}
.mnav b{min-width:96px;text-align:center;font-size:.92rem}
.over-txt{color:var(--debt)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.88rem}
.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:5px;background:var(--c,var(--green))}

.sum-list{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.sum-list div{display:flex;justify-content:space-between;gap:10px}
.sum-list .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:700}
.sum-list .neg{color:var(--debt)}
.warn{color:var(--debt);font-size:.86rem;margin:8px 0 0}
.note{color:var(--muted);font-size:.84rem;margin:8px 0 0;line-height:1.45}

.seg{display:flex;gap:4px;background:var(--track);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;border-radius:8px;background:none;padding:8px 4px;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);font-weight:600}
.plan-ctl{display:flex;flex-direction:column;gap:10px}
.extra{display:flex;align-items:center;gap:10px;font-size:.92rem}
.extra label{flex:1}
.extra input{width:120px;border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:9px 10px;text-align:right}
.payoff{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.payoff .big{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.save-note{color:var(--green-ink);font-weight:600;font-size:.88rem}
.mini-prog{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:5px;max-width:160px}
.mini-prog i{display:block;height:100%;background:var(--green)}

.chart{display:block;width:100%;height:auto;margin-top:6px}
.chart-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:4px}
.chart-key span{display:flex;align-items:center;gap:6px}
.chart-key span::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--c)}
.chart-key span.dash::before{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.78rem}
th:first-child,td:first-child{text-align:left;white-space:normal}
tbody tr{border-top:1px solid var(--line)}
tfoot tr{border-top:2px solid var(--line);font-weight:700}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{display:flex;max-width:680px;margin:0 auto;padding:6px 8px;gap:4px}
.tab{flex:1;min-width:0;border:0;background:none;border-radius:12px;padding:10px 0;font-weight:600;color:var(--muted);font-size:.88rem}
.tab[aria-selected="true"]{background:var(--surface);color:var(--green-ink);box-shadow:inset 0 0 0 1px var(--line)}

dialog{border:0;border-radius:18px;padding:20px;width:min(94vw,420px);max-height:88dvh;background:var(--surface);color:var(--ink);box-shadow:0 10px 40px var(--shadow)}
dialog::backdrop{background:rgba(20,26,20,.45)}
dialog h2{margin:0 0 4px;font-size:1.15rem}
dialog p{margin:0;color:var(--muted);line-height:1.45}
.fields{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:.86rem;color:var(--muted)}
.fields input,.fields select{border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:10px 12px;font-size:1rem;color:var(--ink);width:100%}
.fields input:focus,.fields select:focus,.extra input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:600;background:var(--green);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--debt);margin-right:auto}
.btn.danger-fill{background:var(--debt);color:var(--on-accent)}
.menu-list{display:flex;flex-direction:column;margin-top:8px}
.menu-list button{border:0;background:none;text-align:left;padding:13px 4px;font-size:1rem;border-top:1px solid var(--line)}
.menu-list button:first-child{border-top:0}
.menu-list small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.menu-list .danger-text{color:var(--debt)}
.menu-list .close{color:var(--muted);text-align:center;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:.92rem;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.show.act{pointer-events:auto}
.toast button{border:0;background:none;color:var(--green-soft);font-weight:700;padding:0 0 0 12px}
@media (max-width:380px){.bar-row{grid-template-columns:76px minmax(0,1fr) auto}.hero .big{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="v-home">
  <header><div class="wrap"><div class="top"><h1 id="home-title">This month</h1><button class="icon-btn" data-act="menu" aria-label="Options">⋯</button></div>
  <div class="sub-head" id="home-sub"></div></div></header>
  <main><div class="wrap stack" id="home"></div></main>
</section>
<section id="v-spend" hidden>
  <header><div class="wrap"><div class="top"><h1>Spending</h1><button class="icon-btn" data-act="menu" aria-label="Options">⋯</button></div>
  <div class="sub-head">What you've spent against your portions</div></div></header>
  <main><div class="wrap stack" id="spend"></div></main>
</section>
<section id="v-plan" hidden>
  <header><div class="wrap"><div class="top"><h1>Plan</h1><button class="icon-btn" data-act="menu" aria-label="Options">⋯</button></div>
  <div class="sub-head">Paychecks, bills and where the rest goes</div></div></header>
  <main><div class="wrap stack" id="plan"></div></main>
</section>
<section id="v-debt" hidden>
  <header><div class="wrap"><div class="top"><h1>Debt</h1><button class="icon-btn" data-act="menu" aria-label="Options">⋯</button></div>
  <div class="sub-head">Payoff plan and dates</div></div></header>
  <main><div class="wrap stack" id="debt"></div></main>
</section>
<section id="v-save" hidden>
  <header><div class="wrap"><div class="top"><h1>Savings</h1><button class="icon-btn" data-act="menu" aria-label="Options">⋯</button></div>
  <div class="sub-head">Investments and auto-transfers</div></div></header>
  <main><div class="wrap stack" id="save"></div></main>
</section>

<div class="bottom"><nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="home">Month</button>
  <button class="tab" role="tab" data-tab="spend">Spend</button>
  <button class="tab" role="tab" data-tab="plan">Plan</button>
  <button class="tab" role="tab" data-tab="debt">Debt</button>
  <button class="tab" role="tab" data-tab="save">Savings</button>
</nav></div>

<dialog id="edit"><form id="edit-form" method="dialog">
  <h2 id="edit-title"></h2>
  <div class="fields" id="edit-fields"></div>
  <div class="btns">
    <button class="btn danger" value="delete" id="edit-del" formnovalidate>Delete</button>
    <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
    <button class="btn" value="save" id="edit-save">Save</button>
  </div>
</form></dialog>

<dialog id="menu"><form method="dialog">
  <h2 id="menu-title"></h2><p id="menu-sub"></p>
  <div class="menu-list" id="menu-list"></div>
</form></dialog>

<dialog id="confirm"><form method="dialog">
  <h2 id="confirm-title"></h2><p id="confirm-body"></p>
  <div class="btns"><button class="btn ghost" value="cancel">Cancel</button><button class="btn danger-fill" value="ok" id="confirm-ok">OK</button></div>
</form></dialog>

<input type="file" id="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'tally-budget.v1';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dkey(d); };
const addMonths = (k, n) => {
  const d = parse(k), day = d.getDate(), t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  t.setDate(Math.min(day, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
  return dkey(t);
};
const todayKey = () => dkey(new Date());
const monthYear = k => parse(k).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
const shortDate = k => parse(k).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

/* ---------- money ---------- */
const fmt = (n, cents) => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
const short$ = n => Math.abs(n) >= 1e9 ? '$' + (n / 1e9).toFixed(1) + 'B' : Math.abs(n) >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : Math.abs(n) >= 1e4 ? '$' + Math.round(n / 1e3) + 'k' : fmt(n);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; };

/* ---------- frequencies ---------- */
const FREQ = [['weekly', 'Every week'], ['biweekly', 'Every 2 weeks'], ['semimonthly', 'Twice a month'], ['monthly', 'Every month'], ['quarterly', 'Every 3 months'], ['yearly', 'Every year']];
const PER_MONTH = { weekly: 52 / 12, biweekly: 26 / 12, semimonthly: 2, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 };
const freqName = f => (FREQ.find(x => x[0] === f) || FREQ[3])[1];
const monthly = (amt, f) => num(amt) * (PER_MONTH[f] ?? 1);
// every date an item lands on between from and to (inclusive)
function occurrences(start, freq, from, to) {
  const out = [];
  if (!start) return out;
  if (freq === 'weekly' || freq === 'biweekly') {
    const step = freq === 'weekly' ? 7 : 14;
    let k = start;
    if (k < from) { const gap = Math.round((parse(from) - parse(k)) / 864e5); k = addDays(k, Math.floor(gap / step) * step); }
    for (; k <= to; k = addDays(k, step)) if (k >= from) out.push(k);
    return out;
  }
  const step = { semimonthly: 1, monthly: 1, quarterly: 3, yearly: 12 }[freq] || 1;
  // jump close to `from` so old start dates don't run out of iterations
  let i0 = 0;
  if (start < from) { const a = parse(start), b = parse(from); i0 = Math.max(0, Math.floor(((b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth()) / step) - 1); }
  for (let i = i0; i < i0 + 1200; i++) {
    const k = addMonths(start, i * step);
    if (k > to) break;
    if (k >= from) out.push(k);
    if (freq === 'semimonthly') { const k2 = addDays(k, 15); if (k2 >= from && k2 <= to) out.push(k2); }
  }
  return out.sort();
}
// a monthly due day, moved to the last day in short months (31st → Feb 28)
function dueDates(day, from, to) {
  const out = [], d = parse(from); d.setDate(1);
  for (let i = 0; i < 24; i++, d.setMonth(d.getMonth() + 1)) {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const k = dkey(new Date(d.getFullYear(), d.getMonth(), Math.min(day, last)));
    if (k > to) break;
    if (k >= from) out.push(k);
  }
  return out;
}

const CATS = ['Housing', 'Utilities', 'Food', 'Transport', 'Insurance', 'Subscriptions', 'Health', 'Personal', 'Giving', 'Other'];
const ACCT_TYPES = ['Savings', 'Investment', 'Retirement'];

/* ---------- state ---------- */
function examples() {
  const t = todayKey(), fri = addDays(t, (5 - parse(t).getDay() + 7) % 7 || 7);
  const nextDay = d => { let k = t.slice(0, 8) + pad(d); return k < t ? addMonths(k, 1) : k; };
  const thisMonth = d => t.slice(0, 8) + pad(Math.min(d, parse(t).getDate()));
  const fun = uid();
  return {
    example: true, tab: 'home', updated: 0,

const TABS = ['home', 'spend', 'plan', 'debt', 'save'];
const LISTS = ['incomes', 'expenses', 'debts', 'accounts', 'buckets', 'spends'];
const ID_RE = /^[\w-]{1,40}$/, DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const NONNEG = ['amount', 'balance', 'orig', 'apr', 'min', 'contrib', 'pct', 'goal', 'amt'];
const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
// imported files and old saves are untrusted: coerce every field so rendering can't break
function cleanList(arr, seen) {
  return (Array.isArray(arr) ? arr : []).filter(isObj).map(x => {
    const o = { ...x };
    if (!ID_RE.test(String(o.id)) || seen.has(o.id)) o.id = uid();
    seen.add(o.id);
    for (const k of ['name', 'note', 'cat', 'type', 'to']) if (k in o) o[k] = String(o[k] ?? '').slice(0, 60);
    for (const k of NONNEG) if (k in o) o[k] = Math.max(0, num(o[k]));
    if ('rate' in o) o.rate = num(o.rate);
    if ('freq' in o && !(o.freq in PER_MONTH)) o.freq = 'monthly';
    for (const k of ['start', 'date']) if (k in o && !DATE_RE.test(o[k])) o[k] = todayKey();
    if ('by' in o && !DATE_RE.test(o.by)) o.by = '';
    if ('day' in o) o.day = Math.min(31, Math.max(1, Math.round(num(o.day)) || 1));
    return o;
  });
}
function normalize(d) {
  d = isObj(d) ? d : {};
  const seen = new Set(), p = isObj(d.plan) ? d.plan : {};
  const s = { example: !!d.example, tab: TABS.includes(d.tab) ? d.tab : 'home', updated: num(d.updated), created: num(d.created), lastBackup: num(d.lastBackup) };
  for (const k of LISTS) s[k] = cleanList(d[k], seen);
  s.spends = s.spends.filter(x => 'date' in x);
  s.plan = { strategy: p.strategy === 'snowball' ? 'snowball' : 'avalanche', extra: Math.max(0, num(p.extra)) };
  s.paid = {};
  if (isObj(d.paid)) for (const k in d.paid) if (d.paid[k]) s.paid[k] = 1;
  s.history = {};
  if (isObj(d.history)) for (const k in d.history) if (/^\d{4}-\d{2}$/.test(k) && isObj(d.history[k])) s.history[k] = { saved: num(d.history[k].saved), debt: num(d.history[k].debt) };
  return s;
}

/* ---------- math ---------- */
function totals() {
  const income = S.incomes.reduce((a, i) => a + monthly(i.amount, i.freq), 0);
  const bills = S.expenses.reduce((a, e) => a + monthly(e.amount, e.freq), 0);
  const mins = S.debts.filter(d => num(d.balance) > 0).reduce((a, d) => a + num(d.min), 0);
  const extra = S.debts.some(d => num(d.balance) > 0) ? num(S.plan.extra) : 0;
  const transfers = S.accounts.reduce((a, x) => a + monthly(x.contrib, x.freq), 0);
  const committed = bills + mins + extra + transfers;
  const checks = S.incomes.reduce((a, i) => a + (PER_MONTH[i.freq] ?? 1), 0);
  return { income, bills, mins, extra, debtPay: mins + extra, transfers, committed, left: income - committed, checks };
}

function simulate(extra, strategy) {
  const ds = S.debts.filter(d => num(d.balance) > 0).map(d => ({ id: d.id, apr: num(d.apr), min: num(d.min), bal: num(d.balance), paid: null, interest: 0 }));
  const budget = ds.reduce((a, d) => a + d.min, 0) + Math.max(0, extra);
  const series = [ds.reduce((a, d) => a + d.bal, 0)];
  let m = 0, interest = 0;
  while (ds.some(d => d.bal > 0.005) && m < 600) {
    m++;
    for (const d of ds) if (d.bal > 0) { const i = d.bal * d.apr / 1200; d.bal += i; d.interest += i; interest += i; }
    let avail = budget;
    for (const d of ds) if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; avail -= p; }
    const order = ds.filter(d => d.bal > 0.005).sort(strategy === 'snowball' ? (a, b) => a.bal - b.bal : (a, b) => b.apr - a.apr || a.bal - b.bal);
    for (const d of order) { if (avail <= 0) break; const p = Math.min(avail, d.bal); d.bal -= p; avail -= p; }
    for (const d of ds) if (d.bal <= 0.005 && d.paid === null) { d.bal = 0; d.paid = m; }
    series.push(ds.reduce((a, d) => a + d.bal, 0));
  }
  const done = !ds.some(d => d.bal > 0.005);
  return { byId: Object.fromEntries(ds.map(d => [d.id, d])), months: done ? m : null, interest, series };
}

function project(acct, months) {
  const r = num(acct.rate) / 1200, c = monthly(acct.contrib, acct.freq);
  let b = num(acct.balance); const pts = [b];
  for (let i = 0; i < months; i++) { b = b * (1 + r) + c; pts.push(b); }
  return pts;
}

function chart({ series, startLabel, endLabel, height = 150 }) {
  const W = 320, H = height, L = 42, R = 10, T = 12, B = 22;
  const len = Math.max(2, ...series.map(s => s.pts.length));
  const hi = Math.max(1, ...series.flatMap(s => s.pts));
  const x = i => L + i * (W - L - R) / (len - 1), y = v => T + (1 - v / hi) * (H - T - B);
  let g = '';
  [0, .5, 1].forEach(f => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(hi * f).toFixed(1)}" y2="${y(hi * f).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${(y(hi * f) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${short$(hi * f)}</text>`;
  });
  for (const s of series) {
    const p = s.pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.fill) g += `<path d="${p} L${x(s.pts.length - 1).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z" fill="${s.color}" opacity=".14"/>`;
    g += `<path d="${p}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 1.8 : 2.4}" ${s.dash ? 'stroke-dasharray="4 3"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (!s.dash) { const li = s.pts.length - 1; g += `<circle cx="${x(li).toFixed(1)}" cy="${y(s.pts[li]).toFixed(1)}" r="3.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2"/>`; }
  }
  g += `<text x="${L}" y="${H - 5}" font-size="10" fill="var(--muted)">${esc(startLabel)}</text><text x="${W - R}" y="${H - 5}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(endLabel)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">${g}</svg>`;
}

/* ---------- Month (overview) ---------- */
function upcoming(days) {
  const t = todayKey(), end = addDays(t, days - 1), ev = [];
  for (const i of S.incomes) for (const k of occurrences(i.start, i.freq, t, end)) ev.push({ k, name: i.name, amt: num(i.amount), kind: 'pay', id: i.id, form: 'income' });
  for (const e of S.expenses) for (const k of occurrences(e.start, e.freq, t, end)) ev.push({ k, name: e.name, amt: -num(e.amount), kind: 'bill', id: e.id, form: 'expense' });
  for (const d of S.debts) if (num(d.balance) > 0 && d.day) for (const k of dueDates(+d.day, t, end)) ev.push({ k, name: d.name, amt: -num(d.min), kind: 'debt', id: d.id, form: 'debt' });
  for (const a of S.accounts) if (num(a.contrib) > 0) for (const k of occurrences(a.start, a.freq, t, end)) ev.push({ k, name: a.name, amt: -num(a.contrib), kind: 'save', id: a.id, form: 'account' });
  for (const e of ev) e.paid = !!S.paid[e.id + '|' + e.k];
  return ev.sort((a, b) => a.k.localeCompare(b.k) || b.amt - a.amt);
}

// portions get a budget from what's left; categories are compared with the bills planned in them
function spendLines(m) {
  const left = Math.max(0, totals().left), list = S.spends.filter(x => x.date.slice(0, 7) === m), by = {};
  for (const x of list) by[x.to] = (by[x.to] || 0) + num(x.amt);
  const lines = S.buckets.map(b => ({ to: 'b:' + b.id, name: b.name, plan: left * num(b.pct) / 100, spent: by['b:' + b.id] || 0, portion: true }));
  const catPlan = {};
  for (const e of S.expenses) catPlan[e.cat || 'Other'] = (catPlan[e.cat || 'Other'] || 0) + monthly(e.amount, e.freq);
  for (const c of CATS) if (by['c:' + c]) lines.push({ to: 'c:' + c, name: c, plan: catPlan[c] || 0, spent: by['c:' + c] });
  const known = new Set(lines.map(l => l.to)), orphan = Object.entries(by).filter(([k]) => !known.has(k)).reduce((a, [, v]) => a + v, 0);
  if (orphan) lines.push({ to: '', name: 'Removed portion', plan: 0, spent: orphan });
  const P = lines.filter(l => l.portion);
  return { lines, list, total: list.reduce((a, x) => a + num(x.amt), 0), pPlan: P.reduce((a, l) => a + l.plan, 0), pSpent: P.reduce((a, l) => a + l.spent, 0) };
}

      ${chart({ series: [{ pts: plan.series, color: 'var(--debt)', fill: true }, ...(num(S.plan.extra) > 0 ? [{ pts: base.series, color: 'var(--muted)', dash: true }] : [])], startLabel: 'Now', endLabel: monthYear(addMonths(t, Math.min(end, 600))) })}
      <div class="chart-key"><span style="--c:var(--debt)">Your plan</span>${num(S.plan.extra) > 0 ? `<span class="dash" style="--c:var(--muted)">Minimums only</span>` : ''}</div></div>`;
  }

  h += `<div class="card"><div class="card-head"><h2>Your debts</h2><button class="add-btn" data-act="add" data-form="debt">+ Add</button></div>`;
  if (S.debts.length) {
    const order = [...S.debts].sort((a, b) => (plan.byId[a.id]?.paid ?? 9999) - (plan.byId[b.id]?.paid ?? 9999));
    h += `<ul class="rows">${order.map(d => {
      const r = plan.byId[d.id], bal = num(d.balance), orig = Math.max(num(d.orig), bal), pct = orig ? (1 - bal / orig) * 100 : 0;
      const when = bal <= 0 ? 'Paid off' : r?.paid ? `Paid off ${monthYear(addMonths(t, r.paid))}` : 'Not paid off at this rate';
      return `<li><button class="row" data-act="edit" data-form="debt" data-id="${esc(d.id)}">
        <span class="row-main"><b>${esc(d.name)}</b><small class="num">${num(d.apr)}% APR · ${fmt(num(d.min))} min${d.day ? ` · due the ${ord(d.day)}` : ''}</small>
        <small style="color:${r?.paid || bal <= 0 ? 'var(--green-ink)' : 'var(--debt)'};font-weight:600">${when}</small>
        ${orig > bal ? `<span class="mini-prog"><i style="width:${pct.toFixed(1)}%"></i></span>` : ''}</span>
        <span class="row-amt num">${fmt(bal, true)}${orig > bal ? `<small>${Math.round(pct)}% paid</small>` : ''}</span></button></li>`;
    }).join('')}</ul>`;

}
const ord = n => { n = +n; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

/* ---------- Savings ---------- */

  h += `<div class="card"><div class="card-head"><h2>Accounts and auto-transfers</h2><button class="add-btn" data-act="add" data-form="account">+ Add</button></div>`;
  if (S.accounts.length) {
    h += `<ul class="rows">${S.accounts.map(a => {
      const next = num(a.contrib) > 0 ? occurrences(a.start, a.freq, t, addDays(t, 400))[0] : null, g = goalInfo(a);
      return `<li><button class="row" data-act="edit" data-form="account" data-id="${esc(a.id)}">
      <span class="pill p-save">${esc(a.type || 'Savings')}</span>
      <span class="row-main"><b>${esc(a.name)}</b><small class="num">${num(a.contrib) > 0 ? `${fmt(num(a.contrib), true)} ${freqName(a.freq).toLowerCase()}${next ? ` · next ${shortDate(next)}` : ''}` : 'No auto-transfer'} · ${num(a.rate)}%/yr</small>
      ${g ? `<span class="goal num ${g.ok ? 'ok' : 'behind'}">${esc(g.text)}</span><span class="mini-prog"><i style="width:${g.pct.toFixed(1)}%"></i></span>` : ''}</span>
      <span class="row-amt num">${fmt(num(a.balance))}<small>${fmt(monthly(a.contrib, a.freq))} / mo</small></span></button></li>`; }).join('')}</ul>`;
    h += `<div class="tbl-wrap"><table><thead><tr><th>Projected</th><th>1 yr</th><th>5 yr</th><th>10 yr</th></tr></thead><tbody>
      ${projs.map(p => `<tr><td>${esc(p.a.name)}</td><td>${short$(p.pts[12])}</td><td>${short$(p.pts[60])}</td><td>${short$(p.pts[120])}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td>${short$(total[12])}</td><td>${short$(total[60])}</td><td>${short$(total[120])}</td></tr></tfoot></table></div>`;
  } else h += `<p class="empty">Add savings, a 401(k), an IRA or a brokerage account and its automatic transfer.</p>`;
  h += `</div>`;
  $('#save').innerHTML = h;
}
const monthsBetween = (a, b) => { const x = parse(a), y = parse(b); return (y.getFullYear() - x.getFullYear()) * 12 + y.getMonth() - x.getMonth(); };
// progress toward an account's optional goal, and what it takes to hit the goal date
function goalInfo(a) {
  const goal = num(a.goal), bal = num(a.balance), t = todayKey();
  if (!goal) return null;
  if (bal >= goal) return { pct: 100, text: `${fmt(goal)} goal reached`, ok: true };
  const pct = bal / goal * 100;
  if (a.by && a.by > t) {
    const n = Math.max(1, monthsBetween(t, a.by)), r = num(a.rate) / 1200, g = Math.pow(1 + r, n);
    const need = Math.max(0, r ? (goal - bal * g) * r / (g - 1) : (goal - bal) / n);
    const ok = monthly(a.contrib, a.freq) >= need - 0.5;
    return { pct, ok, text: `${fmt(goal)} by ${monthYear(a.by)} · ${ok ? 'on track' : `needs ${fmt(need)}/mo`}` };
  }
  const i = project(a, 600).findIndex(v => v >= goal);
  return { pct, ok: i > 0, text: i > 0 ? `${fmt(goal)} goal · reached ${monthYear(addMonths(t, i))}` : `${fmt(goal)} goal · not reached at this rate` };
}

/* ---------- forms ---------- */
const F = {
  income: { title: 'Paycheck', list: 'incomes', fields: [['name', 'Name', 'text', 'Paycheck'], ['amount', 'Take-home per check', 'money'], ['freq', 'How often', 'freq'], ['start', 'Next payday', 'date']] },
  expense: { title: 'Bill or expense', list: 'expenses', fields: [['name', 'Name', 'text', 'Rent'], ['amount', 'Amount', 'money'], ['freq', 'How often', 'freq'], ['cat', 'Category', 'cat'], ['start', 'Next due', 'date']] },
  debt: { title: 'Debt', list: 'debts', fields: [['name', 'Name', 'text', 'Credit card'], ['balance', 'Current balance', 'money'], ['apr', 'Interest rate (APR %)', 'pct'], ['min', 'Minimum payment', 'money'], ['day', 'Due day of month', 'day']] },
  account: { title: 'Account', list: 'accounts', fields: [['name', 'Name', 'text', 'Roth IRA'], ['type', 'Type', 'type'], ['balance', 'Current balance', 'money'], ['contrib', 'Auto-transfer amount', 'money'], ['freq', 'How often', 'freq'], ['start', 'Next transfer', 'date'], ['rate', 'Expected growth per year (%)', 'pct'], ['goal', 'Goal (optional)', 'money'], ['by', 'Goal date (optional)', 'date-opt']] },
  bucket: { title: 'Portion', list: 'buckets', fields: [['name', 'Name', 'text', 'Fun money'], ['pct', "Share of what's left (%)", 'pct']] },
  spend: { title: 'Spending', list: 'spends', fields: [['amt', 'Amount', 'money'], ['date', 'Date', 'date'], ['to', 'From', 'to'], ['note', 'What for (optional)', 'note', 'Dinner out']] }
};
const OPTIONAL = ['contrib', 'goal'];
const WIDE = ['text', 'freq', 'note', 'to'];
const defaults = () => ({ freq: 'monthly', cat: 'Other', type: 'Savings', start: todayKey(), date: todayKey(), rate: 0, day: 1, to: S.buckets[0] ? 'b:' + S.buckets[0].id : 'c:Food' });
let editCtx = null;
function field([k, label, type, ph], v) {
  const id = 'f-' + k, val = v ?? defaults()[k] ?? '';
  const opt = ([o, n]) => `<option value="${esc(o)}"${o === val ? ' selected' : ''}>${esc(n)}</option>`;
  const sel = opts => `<select id="${id}">${opts.map(opt).join('')}</select>`;
  let inp;
  if (type === 'freq') inp = sel(FREQ);
  else if (type === 'cat') inp = sel(CATS.map(c => [c, c]));
  else if (type === 'type') inp = sel(ACCT_TYPES.map(c => [c, c]));
  else if (type === 'to') inp = `<select id="${id}">${S.buckets.length ? `<optgroup label="Portions">${S.buckets.map(b => opt(['b:' + b.id, b.name])).join('')}</optgroup>` : ''}
    <optgroup label="Categories">${CATS.map(c => opt(['c:' + c, c])).join('')}</optgroup></select>`;
  else if (type === 'date') inp = `<input id="${id}" type="date" value="${esc(val)}" required>`;
  else if (type === 'date-opt') inp = `<input id="${id}" type="date" value="${esc(val)}">`;
  else if (type === 'day') inp = `<input id="${id}" type="number" inputmode="numeric" min="1" max="31" value="${esc(val)}">`;
  else if (type === 'text' || type === 'note') inp = `<input id="${id}" value="${esc(val)}" placeholder="${esc(ph || '')}" ${type === 'text' ? 'required' : ''} maxlength="60" autocomplete="off">`;
  else inp = `<input id="${id}" class="num" type="number" inputmode="decimal" min="0" step="0.01" value="${val === '' || (OPTIONAL.includes(k) && !val) ? '' : esc(val)}" ${type === 'money' && !OPTIONAL.includes(k) ? 'required' : ''} placeholder="0">`;
  return `<label for="${id}">${esc(label)}${inp}</label>`;
}
function openEdit(form, id, preset) {
  const def = F[form], item = id ? S[def.list].find(x => x.id === id) : null;
  if (id && !item) return;
  editCtx = { form, id };
  $('#edit-title').textContent = (item ? 'Edit ' : form === 'spend' ? 'Log ' : 'New ') + def.title.toLowerCase();
  const vals = item || preset || {}, fs = def.fields.map(f => field(f, vals[f[0]]));
  // pair short fields side by side
  let html = '', i = 0;
  while (i < fs.length) {
    const a = def.fields[i], b = def.fields[i + 1];
    if (b && !WIDE.includes(a[2]) && !WIDE.includes(b[2])) { html += `<div class="two">${fs[i]}${fs[i + 1]}</div>`; i += 2; }
    else { html += fs[i]; i++; }
  }
  $('#edit-fields').innerHTML = html;
  $('#edit-del').hidden = !item;
  const d = $('#edit'); d.returnValue = ''; d.showModal();
  if (!item) setTimeout(() => $('#edit-fields input')?.focus(), 60);
}
$('#edit').addEventListener('close', () => {
  const d = $('#edit'), ctx = editCtx; editCtx = null;
  if (!ctx) return;
  const def = F[ctx.form], list = S[def.list];
  if (d.returnValue === 'delete') {
    const it = list.find(x => x.id === ctx.id);
    if (!it) return;
    const done = undoable(`Deleted ${it.name || it.note || targetName(it.to)}`);
    S[def.list] = list.filter(x => x.id !== ctx.id); commit(); done();
    return;
  }
  if (d.returnValue !== 'save') return;
  const out = {};
  for (const [k, , type] of def.fields) {
    const v = $('#f-' + k).value;
    out[k] = ['money', 'pct'].includes(type) ? Math.round(num(v) * 100) / 100 : type === 'day' ? Math.min(31, Math.max(1, Math.round(num(v) || 1))) : v.trim();
    if (type === 'text' && !out[k]) out[k] = def.title;
    if (type === 'date' && !DATE_RE.test(out[k])) out[k] = todayKey();
  }
  if (ctx.id) {
    const it = list.find(x => x.id === ctx.id);
    if (it) { Object.assign(it, out); if (ctx.form === 'debt' && num(it.balance) > num(it.orig)) it.orig = it.balance; }
  } else list.push(Object.assign({ id: uid() }, out, ctx.form === 'debt' ? { orig: out.balance } : {}));
  if (ctx.form === 'spend') spendMonth = out.date.slice(0, 7);
  commit(); toast(ctx.form === 'spend' && !ctx.id ? `Logged ${fmt(out.amt, true)}` : 'Saved');
});

/* ---------- import / export ---------- */
async function exportData() {
  const data = JSON.stringify(Object.assign({}, S, { app: 'tally', exported: new Date().toISOString() }), null, 2);
  const name = `tally-backup-${todayKey()}.json`;
  const marked = () => { S.lastBackup = Date.now(); saveLocal(); renderAll(); toast('Backup saved'); };
  // iPhone home-screen apps can't download files, so hand the file to the share sheet (Save to Files)
  if (navigator.standalone && navigator.canShare) {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); marked(); } catch (e) { if (e.name !== 'AbortError') toast("Couldn't share the backup"); }
      return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  marked();
}
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (f.size > 5e6) { toast("That file is too big to be a Tally backup"); return; }
  const r = new FileReader();
  r.onload = async () => {
    let d;
    try { d = JSON.parse(r.result); } catch (err) { d = null; }
    if (!isObj(d) || !Array.isArray(d.incomes) || !Array.isArray(d.debts)) { toast("That file isn't a Tally backup"); return; }
    if (!await confirmBox('Replace your budget?', 'Everything here will be replaced with the file you picked. You can switch back from the ⋯ menu.', 'Replace')) return;
    stash();
    const tab = S.tab; S = normalize(d); S.example = false; S.tab = tab; S.lastBackup = Date.now(); commit(); toast('Budget imported');
  };
  r.readAsText(f);
});
function restorePrev() {
  let prev;
  try { prev = JSON.parse(localStorage.getItem(PREV)); } catch (e) {}
  if (!isObj(prev)) { toast('Nothing to restore'); return; }
  const cur = S.example ? null : JSON.stringify(S), tab = S.tab;
  S = normalize(prev); S.tab = tab; commit();
  try { if (cur) localStorage.setItem(PREV, cur); else localStorage.removeItem(PREV); } catch (e) {}
  toast('Previous budget restored');
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; if (S.tab === 'spend') spendMonth = null; saveLocal(); renderAll(); scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'add') openEdit(b.dataset.form, null, b.dataset.to ? { to: b.dataset.to } : spendMonth && spendMonth !== monthKey() && b.dataset.form === 'spend' ? { date: spendMonth + '-01' } : null);
  else if (a === 'edit') openEdit(b.dataset.form, b.dataset.id);
  else if (a === 'paid') { const k = b.dataset.key; if (S.paid[k]) delete S.paid[k]; else S.paid[k] = 1; commit(); }
  else if (a === 'month') { spendMonth = shiftMonth(spendMonth || monthKey(), +b.dataset.v); renderAll(); }
  else if (a === 'export') exportData();
  else if (a === 'reload') location.reload();
  else if (a === 'strategy') { S.plan.strategy = b.dataset.v; commit(); }
  else if (a === 'keep-examples') { S.example = false; commit(); toast('Tap any row to change it'); }
  else if (a === 'clear-examples') {
    S = normalize({ tab: 'plan' }); commit(); scrollTo(0, 0); toast('Cleared. Start with your paychecks.');
  }
  else if (a === 'menu') {
    const last = S.lastBackup ? `Last backup ${new Date(S.lastBackup).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}.` : 'No backup yet.';
    const v = await menu('Tally', `Everything is saved on this device. ${S.example ? 'Export a backup now and then.' : last}`, [
      { value: 'export', label: 'Export backup', sub: 'Save everything as a .json file' },
      { value: 'import', label: 'Import backup', sub: 'Replace this budget with a saved file' },
      ...(hasPrev() ? [{ value: 'restore', label: 'Switch to previous budget', sub: 'The one from before your last import, erase or example load' }] : []),
      ...(S.example ? [] : [{ value: 'examples', label: 'Load example numbers', sub: 'Replaces your budget' }]),
      { value: 'reset', label: 'Erase everything', danger: true }
    ]);
    if (v === 'export') exportData();
    else if (v === 'import') $('#file').click();
    else if (v === 'restore') restorePrev();
    else if (v === 'examples' && await confirmBox('Load example numbers?', 'Your current budget will be replaced. You can switch back from this menu.', 'Replace')) { stash(); const tab = S.tab; S = examples(); S.tab = tab; commit(); }
    else if (v === 'reset' && await confirmBox('Erase everything?', 'All paychecks, bills, debts, accounts and spending will be removed. You can switch back from this menu until you replace the budget again.', 'Erase')) { stash(); S = normalize({ tab: 'plan' }); commit(); toast('Erased'); }
  }
});
let extraT;
document.addEventListener('input', e => {
  if (e.target.id !== 'extra-in') return;
  clearTimeout(extraT);
  extraT = setTimeout(() => { S.plan.extra = Math.max(0, num(e.target.value)); commit(); $('#extra-in')?.focus(); }, 450);
});

const RENDER = { home: renderHome, spend: renderSpend, plan: renderPlan, debt: renderDebt, save: renderSave };
function renderAll() {
  const tab = TABS.includes(S.tab) ? S.tab : 'home';
  for (const v of TABS) $('#v-' + v).hidden = v !== tab;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  document.title = { home: 'Tally', spend: 'Spending · Tally', plan: 'Plan · Tally', debt: 'Debt · Tally', save: 'Savings · Tally' }[tab];
  // a bad value should never leave a blank screen with no way to get the data out
  try { RENDER[tab](); }
  catch (err) {
    console.error(err);
    $('#' + tab).innerHTML = `<div class="card"><h2>This page couldn't be shown</h2><p class="note">Your budget is still saved. Export a backup, then try another tab or reload.</p>
      <div class="btns"><button class="btn ghost" data-act="reload">Reload</button><button class="btn" data-act="export">Export backup</button></div><p class="note num">${esc(err && err.message)}</p></div>`;
  }
}
// another open copy of Tally saved: pick up its changes instead of overwriting them later
addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  const d = loadLocal();
  if (d && !$('#edit').open) { const tab = S.tab; S = d; S.tab = tab; renderAll(); }
});
// redraw when the app comes back, so "today" and the 14-day list stay current
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('dialog[open]')) renderAll(); });

// ?tab=home|spend|plan|debt|save opens straight to that tab; &add=1 opens the log-spending sheet (home-screen shortcuts use these)
const q = new URLSearchParams(location.search);
if (TABS.includes(q.get('tab'))) S.tab = q.get('tab');
if (!S.example && !S.history[monthKey()]) { S.created ||= Date.now(); snapshot(); saveLocal(); }
renderAll();
if (q.get('add') === '1') { history.replaceState(null, '', location.pathname); openEdit('spend'); }
navigator.storage?.persist?.();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
